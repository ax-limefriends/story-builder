<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스토리 빌더</title>
<meta name="description" content="브랜드스크립트(스토리브랜드 7단계)를 채우면 와디즈 스토리 섹션이 차례대로 채워지고, 접힘선·필수 안내·위험 표현을 점검해 이미지와 텍스트 붙여넣기 순서로 내보내는 도구. 모든 작업은 브라우저 안에서만 이뤄집니다.">
<link rel="canonical" href="https://mc-jeon.github.io/story-builder/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="스토리 빌더">
<meta property="og:title" content="스토리 빌더 · 고객이 주인공인 펀딩 스토리를 한 화면에서">
<meta property="og:description" content="브랜드스크립트를 채우면 와디즈 스토리가 차례대로 채워지고, 접힘선·필수 안내·위험 표현을 점검해 내보냅니다. 설치·로그인 없이 브라우저에서만 작동합니다.">
<meta property="og:url" content="https://mc-jeon.github.io/story-builder/">
<meta property="og:image" content="https://mc-jeon.github.io/story-builder/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="스토리 빌더: 브랜드스크립트로 채우는 와디즈 스토리 미리보기">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="스토리 빌더">
<meta name="twitter:description" content="브랜드스크립트를 채우면 와디즈 스토리가 채워지고, 점검해 내보냅니다">
<meta name="twitter:image" content="https://mc-jeon.github.io/story-builder/og.png">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;800&display=swap">
<style>
  :root{--hd:#16302B;--ac:#E9B44C;--ink:#1C2522;--sub:#66726D;--line:#E0E5E2;--bg:#F7F9F8;--char:#26302C;--wz:#00B2B2;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif;color:var(--ink);background:var(--bg);font-size:14px;word-break:keep-all;}
  button,select,input,textarea{font-family:inherit;}
  header{background:var(--hd);border-bottom:4px solid var(--ac);color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:0;z-index:30;}
  header h1{font-size:17px;font-weight:900;margin-right:auto;display:flex;align-items:center;gap:10px;}
  header h1 small{font-size:11px;font-weight:700;background:var(--ac);color:var(--hd);border-radius:4px;padding:1px 6px;}
  header h1 .fmt{font-size:11px;font-weight:700;border:1px solid rgba(255,255,255,.5);border-radius:4px;padding:1px 6px;color:#dfe9e5;}
  .btn{font-size:13px;font-weight:700;border:none;border-radius:8px;padding:8px 12px;cursor:pointer;background:#e5e7eb;color:#222;display:inline-flex;align-items:center;gap:4px;}
  .btn.p{background:var(--ac);color:var(--hd);}
  .btn.d{background:var(--char);color:#fff;}
  .btn.s{padding:4px 8px;font-size:12px;}
  .btn.g{background:#fff;border:1px solid var(--line);}
  .btn.on{background:var(--hd);color:#fff;}
  .btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:1px;}
  .layout{display:grid;grid-template-columns:minmax(340px,470px) minmax(0,1fr);gap:16px;padding:16px;align-items:start;}
  .layout>div{min-width:0;}
  @media(max-width:1020px){.layout{grid-template-columns:minmax(0,1fr);}}
  .tabs{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap;}
  .tabs .btn{flex:1;justify-content:center;}
  .panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;}
  .panel h2{font-size:15px;font-weight:900;color:var(--hd);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
  .panel h2 .tag{font-size:11px;background:var(--hd);color:#fff;border-radius:4px;padding:1px 6px;}
  .panel h3{font-size:13px;font-weight:900;color:var(--hd);margin:14px 0 6px;}
  .form{display:grid;gap:8px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;}
  label.f{display:block;font-size:12px;font-weight:700;color:var(--sub);margin-bottom:3px;}
  select,input[type=text],input[type=number],input[type=date],textarea{font-size:13.5px;border:1px solid #c9d2ce;border-radius:8px;padding:7px 9px;width:100%;background:#fff;color:var(--ink);}
  textarea{min-height:64px;resize:vertical;line-height:1.5;}
  input[type=color]{width:100%;height:34px;border:1px solid var(--line);border-radius:8px;padding:2px;background:#fff;}
  input[type=range]{width:100%;}
  .hint{font-size:11.5px;color:var(--sub);margin-top:3px;line-height:1.5;}
  .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .chk{display:flex;align-items:center;gap:6px;font-size:13px;}
  .blk{border:1px solid var(--line);border-left:4px solid var(--hd);border-radius:12px;margin:10px 0;background:#fcfdfc;}
  .blk.tx{border-left-color:var(--wz);}
  .blk .hd{display:flex;gap:6px;align-items:center;padding:8px 10px;cursor:pointer;}
  .blk .hd .n{font-weight:900;color:#a8501f;min-width:22px;}
  .blk .hd .ty{font-size:11px;font-weight:800;background:var(--hd);color:#fff;border-radius:4px;padding:1px 6px;white-space:nowrap;}
  .blk.tx .hd .ty{background:var(--wz);}
  .blk .hd .tt{flex:1;font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
  .blk .bd{padding:4px 12px 12px;display:grid;gap:8px;}
  .blk.fold .bd{display:none;}
  .thumbs{display:flex;flex-wrap:wrap;gap:6px;}
  .thumbs span{position:relative;}
  .thumbs img{width:58px;height:58px;object-fit:cover;border-radius:6px;border:1px solid var(--line);}
  .thumbs button{position:absolute;top:-6px;right:-6px;padding:0 5px;font-size:11px;border-radius:999px;background:#c8412b;color:#fff;border:none;cursor:pointer;}
  .upl{display:inline-block;font-size:12px;font-weight:700;background:#eef1ef;border-radius:8px;padding:6px 10px;cursor:pointer;}
  .rwprev{font-size:12px;color:var(--sub);line-height:1.6;margin-top:4px;}
  .rwprev b{color:var(--ink);}
  /* 점검 */
  .qa .score{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;}
  .qa .score b{font-size:32px;font-weight:900;color:var(--hd);}
  .qa .score span{color:var(--sub);font-size:13px;}
  .qa .bar{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-bottom:10px;}
  .qa .bar i{display:block;height:100%;background:linear-gradient(90deg,#b4412b,#E9B44C,#2f6b57);}
  .qa ul{list-style:none;display:grid;gap:5px;}
  .qa li{font-size:13px;line-height:1.5;padding-left:22px;position:relative;}
  .qa li::before{position:absolute;left:0;top:0;font-weight:900;}
  .qa li.ok::before{content:"✓";color:#2f6b57;}
  .qa li.no::before{content:"!";color:#b4412b;}
  .qa li.warn::before{content:"△";color:#b7791f;}
  .qa li.info::before{content:"i";color:#2563eb;}
  .qa li[data-go]{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px;}
  .qa .meta{font-size:12px;color:var(--sub);margin-top:8px;}
  .viewbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1b2530;color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;}
  .toast.on{opacity:1;}
  /* ===== 와디즈 화면 틀 ===== */
  .stage{background:#E3E8E6;border-radius:14px;padding:16px;overflow-x:auto;}
  #frame{margin:0 auto;background:#fff;border-radius:10px;box-shadow:0 2px 14px rgba(0,0,0,.08);overflow:hidden;font-size:13px;color:#222;}
  /* 틀 폭 = 좌우 여백(--gx) ×2 + 스토리 폭 (+ 데스크톱은 간격 + 오른쪽 패널). 모든 상자는 같은 좌우 여백 안에 정렬 */
  #frame.desk{--gx:16px;width:1200px;}
  #frame.mob{--gx:10px;width:390px;}
  #frame.raw{width:auto;background:transparent;box-shadow:none;}
  #frame.raw .wz,#frame.raw .fside,#frame.raw .fbar,#frame.raw .pad{display:none !important;}
  #frame.raw .frow{padding:0;justify-content:center;}
  .pad{padding:0 var(--gx);}
  .frow{display:flex;gap:24px;align-items:flex-start;padding:0 var(--gx);}
  .fmain{flex:none;min-width:0;}
  .fside{flex:1 1 0;min-width:0;}
  .fside.stick{position:sticky;top:70px;}
  #frame.mob .frow{display:block;}
  .scw{overflow:hidden;}
  .wz{background:#f1f3f2;color:#7b8580;border:1px dashed #c6cecb;border-radius:8px;padding:24px 12px 10px;margin:8px 0;font-size:12px;line-height:1.55;position:relative;}
  .wz:first-child{margin-top:0;}
  .wz::after{content:"와디즈 자동";position:absolute;top:6px;right:8px;font-size:10px;font-weight:800;background:#fff;border:1px solid #c6cecb;border-radius:4px;padding:0 5px;color:#8a948f;}
  .wz.mk{background:#fff8e8;border-color:#e9cf8f;color:#7a5d1d;}
  .wz.mk::after{content:"메이커 입력";border-color:#e9cf8f;color:#a07a22;}
  .wz h5{font-size:14px;color:#333;margin-bottom:4px;}
  .wz .big{font-size:18px;font-weight:900;color:#222;}
  .wz .tabs2{display:flex;gap:12px;font-weight:700;color:#555;white-space:nowrap;overflow-x:auto;}
  .wz .tabs2 b{color:#000;border-bottom:2px solid #000;}
  .wz h5 small{font-weight:600;color:#a07a22;margin-left:4px;}
  .wz .sm{display:flex;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:6px;background:#fff;border:1px dashed #e9cf8f;align-items:center;justify-content:center;font-size:13px;color:#a07a22;}
  .thumbs2{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .thumbs2 img{width:56px;height:32px;object-fit:cover;border-radius:3px;border:1px solid #e9cf8f;}
  .thumbs2 span{font-size:11px;border:1px dashed #e9cf8f;border-radius:3px;padding:1px 6px;color:#a07a22;background:#fff;}
  .scaler{position:relative;transform-origin:top left;}
  .rw{border:1px solid #e3e6e5;border-radius:8px;padding:10px 12px;margin-bottom:8px;background:#fff;}
  .rw .bd2{display:inline-block;font-size:10px;font-weight:800;color:var(--wz);border:1px solid var(--wz);border-radius:4px;padding:0 4px;margin-right:4px;}
  .rw .nm{font-size:13px;font-weight:700;margin:4px 0;color:#222;}
  .rw .pr{font-size:14px;font-weight:900;color:#222;}
  .rw .pr i{font-style:normal;color:#e5484d;margin-right:4px;}
  .rw .ls{font-size:11px;color:#aaa;text-decoration:line-through;}
  .fbar{position:sticky;bottom:0;display:none;gap:10px;align-items:center;background:#fff;border-top:1px solid #e3e6e5;padding:8px 10px;z-index:2;}
  #frame.mob .fbar{display:flex;}
  .fbar span{font-size:11px;color:#777;}
  .fbar b{flex:1;text-align:center;background:var(--wz);color:#fff;border-radius:6px;padding:10px;font-size:14px;}
  /* 붙여넣기 순서 */
  dialog{border:none;border-radius:14px;padding:0;max-width:720px;width:calc(100% - 32px);box-shadow:0 10px 40px rgba(0,0,0,.25);}
  dialog::backdrop{background:rgba(10,20,16,.45);}
  .dlg{padding:18px;display:grid;gap:10px;max-height:80vh;overflow:auto;}
  .dlg h2{font-size:16px;color:var(--hd);}
  .seq{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px;}
  .seq .h{display:flex;gap:8px;align-items:center;font-weight:800;}
  .seq .h .k{font-size:11px;border-radius:4px;padding:1px 6px;color:#fff;background:var(--hd);}
  .seq.t .h .k{background:var(--wz);}
  .seq pre{white-space:pre-wrap;font-family:inherit;font-size:12.5px;line-height:1.6;background:#f7f9f8;border-radius:8px;padding:8px 10px;max-height:180px;overflow:auto;}

  /* ===== 결과 페이지 (860px 원본) ===== */
  #page{width:860px;background:var(--pbg);color:var(--pink);font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif;--fs:1;--pad:72px;--r:14px;position:relative;}
  #page.serif .t,#page.serif .ht{font-family:'Noto Serif KR',serif;}
  #page.large{--fs:1.12;}
  #page.tight{--pad:52px;} #page.wide{--pad:96px;}
  #page .b{padding:var(--pad) 64px;position:relative;}
  #page .b.tint{background:var(--ptint);}
  #page .b.dark{background:var(--pdark);color:#fff;}
  #page .sn{font-size:15px;font-weight:800;letter-spacing:3px;opacity:.45;margin-bottom:8px;}
  #page .eb{font-size:calc(18px*var(--fs));font-weight:800;letter-spacing:2px;color:var(--c1);margin-bottom:14px;}
  #page .b.dark .eb{color:var(--c2);}
  #page .t{font-size:calc(40px*var(--fs));line-height:1.38;font-weight:800;margin-bottom:22px;color:inherit;white-space:pre-wrap;}
  #page .bd{font-size:calc(23px*var(--fs));line-height:1.8;white-space:pre-wrap;color:var(--psub);}
  #page .b.dark .bd{color:rgba(255,255,255,.82);}
  #page .c{text-align:center;}
  #page .ph{color:#b9bfca !important;}
  #page.exp .ph,#page.exp .pp,#page.exp div.im,#page.exp .foldline,#page.exp .txtag{display:none !important;}
  #page .box{background:var(--pcard);border-radius:var(--r);border:1px solid rgba(0,0,0,.08);}
  #page .b.dark .box{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.12);}
  #page .hero{min-height:var(--hh);display:flex;flex-direction:column;justify-content:flex-end;padding:90px 64px 80px;color:#fff;background-color:var(--pdark);background-size:cover;background-position:center;position:relative;overflow:hidden;}
  #page .hero.c{justify-content:center;}
  #page .hero .ov{position:absolute;left:0;top:0;right:0;bottom:0;}
  #page .hero .in{position:relative;}
  #page .hero .ht{font-size:calc(58px*var(--fs));line-height:1.28;font-weight:900;margin-bottom:22px;white-space:pre-wrap;letter-spacing:-1px;}
  #page .hero .hs{font-size:calc(25px*var(--fs));line-height:1.7;opacity:.92;white-space:pre-wrap;}
  #page .hero .eb{color:var(--c2);}
  #page .badges{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px;}
  #page .hero.c .badges{justify-content:center;}
  #page .badges span{font-size:19px;font-weight:800;border:2px solid rgba(255,255,255,.7);border-radius:999px;padding:8px 20px;}
  #page .ck{display:grid;gap:14px;margin-top:10px;}
  #page .ck div{display:flex;gap:18px;align-items:flex-start;padding:22px 26px;font-size:calc(24px*var(--fs));line-height:1.55;font-weight:600;}
  #page .ck i{flex:none;width:36px;height:36px;border-radius:50%;background:var(--c1);color:#fff;font-style:normal;font-weight:900;font-size:20px;display:flex;align-items:center;justify-content:center;margin-top:2px;}
  #page .note{margin-top:22px;font-size:calc(22px*var(--fs));line-height:1.7;color:var(--psub);white-space:pre-wrap;}
  #page .cmp{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:10px;}
  #page .cmp>div{padding:28px 26px;border-radius:var(--r);}
  #page .cmp .l{background:rgba(0,0,0,.05);}
  #page .b.dark .cmp .l{background:rgba(255,255,255,.06);}
  #page .cmp .r{background:var(--pcard);border:3px solid var(--c1);color:var(--pink);}
  #page .cmp h4{font-size:calc(24px*var(--fs));font-weight:900;margin-bottom:16px;}
  #page .cmp .r h4{color:var(--c1);}
  #page .cmp p{font-size:calc(21px*var(--fs));line-height:1.6;margin-bottom:10px;display:flex;gap:10px;}
  #page .cmp .l p b{color:#9aa1ad;} #page .cmp .r p b{color:var(--c1);}
  #page .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:10px;}
  #page .nums>div{padding:30px 18px;text-align:center;}
  #page .nums b{display:block;font-size:calc(50px*var(--fs));font-weight:900;color:var(--c1);line-height:1.1;margin-bottom:10px;}
  #page .nums span{font-size:calc(19px*var(--fs));line-height:1.5;display:block;}
  #page .src{font-size:15px;opacity:.6;margin-top:16px;text-align:right;}
  #page .pg{display:grid;gap:12px;margin-top:6px;}
  #page .pg.g2{grid-template-columns:1fr 1fr;} #page .pg.g3{grid-template-columns:1fr 1fr 1fr;}
  #page .pg img,#page .pg .pp{width:100%;border-radius:var(--r);object-fit:cover;display:block;}
  #page .pg.g1 img{height:auto;} #page .pg.g2 img,#page .pg.g2 .pp{height:360px;} #page .pg.g3 img,#page .pg.g3 .pp{height:250px;}
  #page .pg.g1 .pp{height:460px;}
  #page .pp{background:rgba(0,0,0,.07);display:block;text-align:center;color:#9aa1ad;font-size:18px;line-height:250px;}
  #page .pg.g2 .pp{line-height:360px;} #page .pg.g1 .pp{line-height:460px;}
  #page .cap{font-size:calc(19px*var(--fs));line-height:1.6;margin-top:14px;color:var(--psub);white-space:pre-wrap;}
  #page .st{display:grid;gap:0;margin-top:10px;}
  #page .st>div{display:flex;gap:24px;align-items:flex-start;position:relative;padding-bottom:30px;}
  #page .st>div:not(:last-child)::after{content:"";position:absolute;left:31px;top:66px;bottom:4px;width:3px;background:var(--c1);opacity:.25;}
  #page .st i{flex:none;width:64px;height:64px;border-radius:50%;background:var(--c1);color:#fff;font-style:normal;font-size:28px;font-weight:900;display:flex;align-items:center;justify-content:center;}
  #page .st h4{font-size:calc(27px*var(--fs));font-weight:900;margin:8px 0 6px;}
  #page .st p{font-size:calc(21px*var(--fs));line-height:1.6;color:var(--psub);}
  #page .b.dark .st p{color:rgba(255,255,255,.8);}
  #page .rv{display:grid;gap:16px;margin-top:10px;}
  #page .rv>div{padding:28px 30px;}
  #page .rv p{font-size:calc(22px*var(--fs));line-height:1.7;white-space:pre-wrap;}
  #page .rv p::before{content:"“";font-size:48px;line-height:0;vertical-align:-18px;color:var(--c1);margin-right:6px;font-family:Georgia,serif;}
  #page .rv span{display:block;margin-top:12px;font-size:17px;font-weight:700;color:var(--psub);}
  #page .nt{font-size:calc(17px*var(--fs));line-height:1.65;background:rgba(0,0,0,.04);border-radius:10px;padding:18px 22px;color:var(--psub);white-space:pre-wrap;}
  /* 받는 것 */
  #page .of{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:10px;}
  #page .of>div{padding:26px 26px;display:flex;gap:16px;align-items:flex-start;}
  #page .of i{flex:none;width:44px;height:44px;border-radius:12px;background:var(--c1);color:#fff;font-style:normal;font-weight:900;font-size:20px;display:flex;align-items:center;justify-content:center;}
  #page .of h4{font-size:calc(23px*var(--fs));font-weight:900;margin-bottom:6px;color:var(--pink);}
  #page .of p{font-size:calc(18px*var(--fs));line-height:1.55;color:var(--psub);}
  /* 저자 */
  #page .au{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:10px;}
  #page .au.one{grid-template-columns:1fr;}
  #page .au>div{padding:26px;display:grid;gap:12px;align-content:start;}

<body>
<header>
  <h1>스토리 빌더 <small>MVP 0.5</small> <span class="fmt" id="fmtName">와디즈 스토리</span></h1>

    var kind=$('#tplKind').value;if(!confirm(TPL_N[kind]+' 기본 순서로 블록을 다시 짤까요? 이미 쓴 블록은 같은 역할 자리로 옮기고, 맞는 자리가 없는 블록은 필수 안내 앞에 남겨 둡니다.'))return;

  });

  $('#add').addEventListener('click',function(){var b=blk($('#addType').value);S.blocks.push(b);open[b.id]=true;renderEditor();soon();say(TYPES[b.type].n+' 블록을 맨 아래에 추가했습니다');});

  /* ===== 탭 ===== */
  function setTab(t){S.tab=t;$$('[data-tab]').forEach(function(b){b.classList.toggle('on',b.dataset.tab===t);b.setAttribute('aria-selected',b.dataset.tab===t);});$$('[data-pane]').forEach(function(p){p.hidden=p.dataset.pane!==t;});}
  $$('[data-tab]').forEach(function(b){b.addEventListener('click',function(){setTab(b.dataset.tab);autosave();});});

  /* ===== 디자인 ===== */
  $('#o-theme').innerHTML=Object.keys(THEMES).map(function(k){return '<option value="'+k+'">'+THEMES[k].n+'</option>';}).join('');
  function syncOpts(){$('#o-theme').value=S.theme;$('#o-c1').value=S.c1;$('#o-c2').value=S.c2;$('#o-font').value=S.font;$('#o-size').value=S.size;$('#o-gap').value=S.gap;$('#o-r').value=S.r;$('#o-rv').textContent=S.r+'px';$('#o-num').checked=!!S.num;$('#fmtName').textContent=F().name;}

  [['#o-c1','c1'],['#o-c2','c2'],['#o-font','font'],['#o-size','size'],['#o-gap','gap']].forEach(function(p){['input','change'].forEach(function(ev){$(p[0]).addEventListener(ev,function(){S[p[1]]=this.value;soon();});});});
  $('#o-r').addEventListener('input',function(){S.r=+this.value;$('#o-rv').textContent=S.r+'px';soon();});

  /* ===== 블록 그리기 ===== */
  function P(v,ph,tag,cls){tag=tag||'span';return v?'<'+tag+(cls?' class="'+cls+'"':'')+'>'+esc(v)+'</'+tag+'>':'<'+tag+' class="'+(cls?cls+' ':'')+'ph">'+esc(ph||'')+'</'+tag+'>';}
  function head(b,sn){var h='';if(sn)h+='<div class="sn">'+sn+'</div>';if(b.eb)h+='<div class="eb">'+esc(b.eb)+'</div>';if(b.title)h+='<h2 class="t">'+esc(b.title)+'</h2>';return h;}
  function badges(v){var a=String(v||'').split(',').map(function(x){return x.trim();}).filter(Boolean);return a.length?'<div class="badges">'+a.map(function(x){return '<span>'+esc(x)+'</span>';}).join('')+'</div>':'';}
  function phf(b,k){var f=TYPES[b.type].f.filter(function(x){return x[0]===k;})[0];return f?String(f[3]||''):'';}
  function L2(v,b,k){var a=lines(v);return a.length?{a:a,ph:false}:{a:lines(phf(b,k)),ph:true};}
  function blockHTML(b,sn){
    var bg=b.bg||'white',c=S.card;
    switch(b.type){
      case 'hero':
        var st='--hh:'+(b.hh||1000)+'px;'+(b.img?'background-image:url('+b.img+');':'');
        return '<section class="b hero'+(b.align==='c'?' c':'')+'" style="'+st+'"><div class="ov" style="background:rgba(0,0,0,'+((b.img?b.ov:0)/100)+')"></div><div class="in">'+(b.eb?'<div class="eb">'+esc(b.eb)+'</div>':'')+P(b.title,phf(b,'title'),'div','ht')+P(b.sub,phf(b,'sub'),'div','hs')+badges(b.badges)+'</div></section>';
      case 'text':
        return '<section class="b '+bg+(b.align==='c'?' c':'')+'">'+head(b,sn)+(b.title||b.eb?'':'<h2 class="t ph">제목</h2>')+(b.body?'<p class="bd">'+esc(b.body)+'</p>':(b.title?'':'<p class="bd ph">본문을 입력하세요</p>'))+'</section>';
      case 'checklist':
        var ck=L2(b.items,b,'items');
        return '<section class="b '+bg+'">'+head(b,sn)+'<div class="ck">'+ck.a.map(function(x){return '<div class="box'+(ck.ph?' ph':'')+'"><i>✓</i><span>'+esc(x[0])+'</span></div>';}).join('')+'</div>'+(b.note?'<p class="note">'+esc(b.note)+'</p>':'')+'</section>';
      case 'compare':
        var l=L2(b.li,b,'li'),r=L2(b.ri,b,'ri');
        return '<section class="b '+bg+'">'+head(b,sn)+'<div class="cmp"><div class="l"><h4>'+esc(b.lt||'흔한 방식')+'</h4>'+l.a.map(function(x){return '<p class="'+(l.ph?'ph':'')+'"><b>✕</b>'+esc(x[0])+'</p>';}).join('')+'</div><div class="r"><h4>'+esc(b.rt||'이 방식')+'</h4>'+r.a.map(function(x){return '<p class="'+(r.ph?'ph':'')+'"><b>✓</b>'+esc(x[0])+'</p>';}).join('')+'</div></div></section>';
      case 'offer':
        var of=L2(b.items,b,'items');
        return '<section class="b '+bg+'">'+head(b,sn)+'<div class="of">'+of.a.map(function(x,j){return '<div class="box'+(of.ph?' ph':'')+'"><i>'+(j+1)+'</i><div><h4>'+esc(x[0])+'</h4><p>'+esc(x[1]||'')+'</p></div></div>';}).join('')+'</div></section>';
      case 'authors':
        var A=[['a1',c.a1name,c.a1role,c.a1bio,c.a1img],['a2',c.a2name,c.a2role,c.a2bio,c.a2img]].filter(function(x,j){return j===0||x[1];});
        return '<section class="b '+bg+'">'+head(b,sn)+'<div class="au'+(A.length===1?' one':'')+'">'+A.map(function(x){var bio=lines(x[3]);return '<div class="box">'+(x[4]?'<img class="im" src="'+x[4]+'" alt="">':'<div class="im">저자 사진</div>')+'<div class="rl">'+esc(x[2]||'')+'</div>'+P(x[1],'저자 이름 (1 카드)','h4')+(bio.length?'<ul>'+bio.map(function(y){return '<li>'+esc(y.join(' | '))+'</li>';}).join('')+'</ul>':'<ul><li class="ph">이력은 사실만 (1 카드)</li></ul>')+'</div>';}).join('')+'</div>'+(b.why?'<p class="why">'+esc(b.why)+'</p>':'')+'</section>';
      case 'beforeafter':

        return '<section class="b '+bg+'">'+head(b,sn)+(b.who?'<div class="eb" style="margin-bottom:10px">'+esc(b.who)+'</div>':'')+'<div class="ba"><div class="bf"><span class="lb">전</span>'+P(b.before,'고치기 전 문장','p')+'</div><div class="arrow">▼</div><div class="af"><span class="lb">후</span>'+P(b.after,'고친 뒤 문장','p')+'</div></div>'+(pt.length?'<div class="pts">'+pt.map(function(x){return '<p><b>✓</b>'+esc(x[0])+'</p>';}).join('')+'</div>':'')+'<div class="basrc">출처: '+esc(srcT)+'</div></section>';
      case 'toc':
        var tc=L2(b.items,b,'items'),ti=b.imgs||[];

      case 'steps':
        var s=L2(b.items,b,'items');
        return '<section class="b '+bg+'">'+head(b,sn)+'<div class="st">'+s.a.map(function(x,j){return '<div class="'+(s.ph?'ph':'')+'"><i>'+(j+1)+'</i><div><h4>'+esc(x[0])+'</h4><p>'+esc(x[1]||'')+'</p></div></div>';}).join('')+'</div></section>';

      case 'tiers':
        var R=rewards();
        var body=R.length?R.map(function(t){var inc=incNames(t);return '<div class="box'+(t.rec?' rec':'')+'">'+(t.rec?'<span class="rb">추천</span>':'')+'<h4>'+esc(t.name)+(b.showPrice&&t.price?'<small>'+won(t.price)+'</small>':'')+'</h4>'+inc.map(function(i){return '<p><b>✓</b>'+esc(i)+'</p>';}).join('')+'</div>';}).join(''):'<div class="box ph" style="padding:28px">1 카드의 리워드를 적으면 여기에 구성이 나옵니다</div>';
        return '<section class="b '+bg+'">'+head(b,sn)+'<div class="tr">'+body+'</div>'+(b.note?'<p class="note">'+esc(b.note)+'</p>':'')+'</section>';
      case 'numbers':
        var nm=L2(b.items,b,'items');
        return '<section class="b '+bg+'">'+head(b,sn)+'<div class="nums">'+nm.a.slice(0,6).map(function(x){return '<div class="box'+(nm.ph?' ph':'')+'"><b>'+esc(x[0])+'</b><span>'+esc(x[1]||'')+'</span></div>';}).join('')+'</div>'+(b.src?'<div class="src">'+esc(b.src)+'</div>':'')+'</section>';
      case 'photos':
        var g=b.layout||'3',im=b.imgs||[],cnt=Math.max(im.length,+g),cells='';
        for(var k=0;k<cnt;k++)cells+=im[k]?'<img src="'+im[k]+'" alt="">':'<div class="pp">사진 '+(k+1)+'</div>';
        return '<section class="b '+bg+'">'+head(b,sn)+'<div class="pg g'+g+'">'+cells+'</div>'+(b.cap?'<p class="cap">'+esc(b.cap)+'</p>':'')+'</section>';
      case 'reviews':
        var rv=lines(b.items);
        return '<section class="b '+bg+'">'+head(b,sn)+'<div class="rv">'+(rv.length?rv.map(function(x){return '<div class="box"><p>'+esc(x[0])+'</p><span>'+esc([x[1],x[2]].filter(Boolean).join(' · '))+'</span></div>';}).join(''):'<div class="box ph"><p>실제로 받은 후기만 적으세요 (출처 함께)</p></div>')+'</div></section>';
      case 'notice':
        return '<section class="b '+bg+'" style="padding-top:28px;padding-bottom:28px">'+P(b.body,phf(b,'body'),'div','nt')+'</section>';
      case 'spacer':
        return '<section class="'+bg+'" style="height:'+(b.size||40)+'px;background:'+(bg==='tint'?'var(--ptint)':bg==='dark'?'var(--pdark)':'var(--pbg)')+'"></section>';
      case 'info':
        var any=false,h=Object.keys(INFO_LABEL).map(function(k){if(b[k])any=true;return '<h4>'+INFO_LABEL[k]+'</h4>'+P(b[k],phf(b,k)||'적어 주세요','p');}).join('');
        return '<section class="tb"><span class="txtag">텍스트로 붙여넣기</span>'+h+'</section>';
      case 'faq':

      case 'proof':
        var pf=L2(b.items,b,'items');
        return '<section class="b '+bg+'">'+head(b,sn)+'<div class="pf">'+pf.a.slice(0,6).map(function(x){return '<div class="box'+(pf.ph?' ph':'')+'"><b>'+esc(x[0])+'</b><span>'+esc(x[1]||'')+'</span>'+(x[2]?'<small>'+esc(x[2])+'</small>':'<small class="ph">출처·기준일</small>')+'</div>';}).join('')+'</div></section>';
      case 'quote':

        return '<section class="b '+bg+'">'+head(b,sn)+(big?'<div class="vq">'+big+'</div>':'<div class="vq ph">'+esc(phf(b,'big'))+'</div>')+P(b.who,phf(b,'who'),'div','vw')+((b.imgs||[]).length?'<div class="caps">'+b.imgs.map(function(x){return '<img src="'+x+'" alt="">';}).join('')+'</div>':'')+'<div class="vsrc">'+(b.src?'출처: '+esc(b.src):'<span class="ph">출처·기준일</span>')+'</div></section>';
      case 'objection':
        var oq=L2(b.items,b,'items');
        if(b.look==='chat')return '<section class="b '+bg+'">'+head(b,sn)+chatHTML(b,oq)+'</section>';
        return '<section class="b '+bg+'">'+head(b,sn)+'<div class="qa2">'+oq.a.map(function(x){return '<div class="q'+(oq.ph?' ph':'')+'">'+esc(x[0])+'</div><div class="a'+(oq.ph?' ph':'')+'">'+esc(x[1]||'')+'</div>';}).join('')+'</div></section>';
      case 'features':
        var fe=L2(b.items,b,'items'),fi=b.imgs||[];
        return '<section class="b '+bg+'">'+head(b,sn)+'<div class="ft">'+fe.a.map(function(x,j){return '<div class="'+(fe.ph?'ph':'')+'"><span class="no">'+String(j+1).padStart(2,'0')+'</span><div><h4>'+esc(x[0])+'</h4><p>'+esc(x[1]||'')+'</p></div>'+(fi[j]?'<img src="'+fi[j]+'" alt="">':'')+'</div>';}).join('')+'</div></section>';
      case 'preview':
        var pv=L2(b.items,b,'items'),pi=b.imgs||[];
        return '<section class="b '+bg+'">'+head(b,sn)+'<div class="pv">'+pv.a.map(function(x,j){return '<div class="'+(pv.ph?'ph':'')+'">'+(x[0]?'<span class="lb">'+esc(x[0])+'</span>':'')+'<h4>'+esc(x[1]||'')+'</h4>'+(x[2]?'<p>'+esc(x[2])+'</p>':'')+(pi[j]?'<img src="'+pi[j]+'" alt="">':'<div class="pp">화면·내지 캡처 '+(j+1)+'</div>')+'</div>';}).join('')+'</div></section>';
      case 'benefit':
        var bn=L2(b.items,b,'items');
        return '<section class="b '+bg+'">'+head(b,sn)+'<div class="bn">'+bn.a.map(function(x,j){return '<div class="box'+(bn.ph?' ph':'')+'"><i>'+String(j+1).padStart(2,'0')+'</i><div><h4>'+esc(x[0])+'</h4>'+(x[1]?'<p>'+esc(x[1])+'</p>':'')+'</div></div>';}).join('')+'</div></section>';
      case 'matrix':
        var MP=partsList(),MR=rewards();
        if(!MP.length||!MR.length)return '<section class="b '+bg+'">'+head(b,sn)+'<div class="box ph" style="padding:28px">1 카드의 구성품(코드)과 리워드를 적으면 요약표가 만들어집니다</div></section>';
        return '<section class="b '+bg+'">'+head(b,sn)+'<table class="mx"><thead><tr><th>구성</th>'+MR.map(function(r){return '<th'+(r.rec?' class="rec"':'')+'>'+esc(r.name)+'</th>';}).join('')+'</tr></thead><tbody>'+MP.map(function(p){return '<tr><td><span class="cd">'+esc(p.code)+'</span>'+esc(p.name)+'</td>'+MR.map(function(r){return hasPart(r,p)?'<td class="y">✓</td>':'<td class="n">–</td>';}).join('')+'</tr>';}).join('')+'</tbody></table></section>';
      case 'parts':
        var PP=partsList(),pim=b.imgs||[];
        return '<section class="b '+bg+'">'+head(b,sn)+'<div class="pt2">'+(PP.length?PP.map(function(p,j){return '<div class="box"><span class="cd">'+esc(p.code)+'</span><div><h4>'+esc(p.name)+'</h4>'+(p.desc?'<p>'+esc(p.desc)+'</p>':'')+'</div>'+(pim[j]?'<img src="'+pim[j]+'" alt="">':'')+'</div>';}).join(''):'<div class="box ph" style="padding:28px">1 카드의 구성품을 적으면 코드별 상세가 나옵니다</div>')+'</div></section>';
      case 'pricecard':
        var PR=rewards();
        return '<section class="b '+bg+'">'+head(b,sn)+'<div class="pc">'+(PR.length?PR.map(function(r){return '<div class="box'+(r.rec?' rec':'')+'">'+(r.rec?'<span class="rb">추천</span>':'')+'<h4>'+esc(r.name)+'</h4>'+(r.who?'<div class="who">'+esc(r.who)+'</div>':'')+(r.off?'<div class="ls">'+won(r.list)+'</div>':'')+'<div class="pr">'+(r.off?'<span class="off">'+r.off+'%</span>':'')+'<span class="won">'+(r.price?won(r.price):'가격 미정')+'</span></div><div class="inc">'+incNames(r).map(function(i){return '<p><b>✓</b>'+esc(i)+'</p>';}).join('')+'</div>'+(r.qty?'<div class="qt">'+r.qty+'개 한정</div>':'')+'</div>';}).join(''):'<div class="box ph" style="padding:28px">1 카드의 리워드를 적으면 가격 카드가 나옵니다</div>')+'</div>'+(b.basis?'<div class="pcsrc">정가 기준: '+esc(b.basis)+'</div>':'')+(b.note?'<p class="note">'+esc(b.note)+'</p>':'')+'</section>';
      case 'event':
        var EV=[['이벤트',b.ev],['대상',b.who],['참여 방법',b.how],['발표',b.when],['지급·발송',b.ship]];
        return '<section class="b '+bg+'">'+head(b,sn)+'<div class="ev">'+EV.map(function(x){return '<b>'+x[0]+'</b>'+(x[1]?'<span>'+esc(x[1])+'</span>':'<span class="ph">적어 주세요</span>');}).join('')+'</div></section>';
      case 'chips':
        var ch=L2(b.items,b,'items');
        return '<section class="b '+bg+' c">'+head(b,sn)+'<div class="chips">'+ch.a.map(function(x){return '<span class="'+(ch.ph?'ph':'')+'">'+esc(x[0])+'</span>';}).join('')+'</div></section>';
      case 'media':
        return '<section class="md"><span class="mdtag">GIF·영상 직접 올리기</span><h4>여기에 GIF·영상을 올립니다</h4>'+P(b.what,phf(b,'what'),'p')+(b.file?'<p>파일: '+esc(b.file)+'</p>':'')+(b.img?'<img src="'+b.img+'" alt="">':'')+'</section>';
      case 'cta':
        return '<section class="b '+bg+' c">'+P(b.title,'제목','h2','t')+'<p class="bd">'+esc(b.button||'')+'</p></section>';
    }
    return '';
  }
  function chatHTML(b,oq){
    var who=b.maker||'메이커',t=0.4,h='',ph=oq.ph?' ph':'';
    oq.a.forEach(function(x){
      h+='<div class="cm me'+ph+'" style="--d:'+t.toFixed(2)+'s"><div class="bub">'+esc(x[0])+'</div></div>';t+=1.1;
      h+='<div class="cm you'+ph+'" style="--d:'+t.toFixed(2)+'s"><span class="av">'+esc(who.charAt(0))+'</span><div><div class="nm">'+esc(who)+'</div><div class="bw"><span class="dots"><i></i><i></i><i></i></span><div class="bub">'+esc(x[1]||'')+'</div></div></div></div>';t+=1.1+Math.min(2.6,0.9+(x[1]||'').length*0.03);
    });
    return '<div class="chat go" data-len="'+t.toFixed(1)+'"><div class="chd"><b>'+esc(who)+'</b><span>메이커에게 문의하기</span></div><div class="cbd">'+h+'</div></div>';
  }
  /* 미리보기에서 대화창 움직임을 반복 재생 */

    Object.assign(byRole('objection'),{look:'chat',anim:true,maker:'저자',title:'사러 오기 전에\n먼저 물어보신 것들',items:'글을 잘 못 쓰는데요?|문장력이 아니라 말하는 순서를 바꾸는 책입니다. 빈칸 워크시트를 따라 채우면 됩니다\n바빠서 읽을 시간이 없어요.|장마다 미션은 5~10분이면 끝납니다. 하루 한 장씩이면 충분해요\n우리 업종도 되나요?|식품·제조·서비스·1인 기업 사례가 나오고, 부록 D에 12개 업종 적용표가 있습니다\n워크시트는 PDF로만 주나요?|아니요, 바로 고쳐 쓸 수 있는 파일로 드립니다 (실습 키트부터)'});
    Object.assign(byRole('plan'),{title:'세 단계로 다시 씁니다'});
    Object.assign(byRole('fit'),{no:'디자인만 바꾸고 싶은 분\n문장을 대신 써 줄 대행사를 찾는 분'});
    Object.assign(byRole('benefit'),{title:'삼무서점에서만',items:'1:1 첨삭|깊이 만나기 리워드 30명 한정 (펀딩 기간에만)\n스토리 빌더 작업 파일|이 펀딩 페이지를 만든 파일을 그대로 드립니다 (깊이 만나기)\n이름이 남는 개정판|첨삭 사례를 동의받아 실으면 상호를 책에 남겨 드립니다 (선택)'});
    Object.assign(byRole('matrix'),{title:'필요한 만큼 고르세요'});
    Object.assign(byRole('parts'),{title:'무엇을 받나요',imgs:['A','B','C','D','E','F','G'].map(function(x){return AS+'p'+x+'.jpg';})});
    Object.assign(byRole('info'),{fundUse:'펀딩금은 실제 소상공인 사례를 더한 개정판 제작과 스토리 빌더 개발에 씁니다. (예시)',delivery:'펀딩 종료 후 결제가 완료되면 와디즈에 등록된 이메일로 순차 발송합니다. (일정 확인 필요)',refund:'디지털 콘텐츠 특성상 발송 후 단순 변심 환불은 어렵습니다. 파일이 열리지 않으면 다시 보내 드립니다. (와디즈 정책 확인 필요)',contact:'메이커에게 문의하기'});
    Object.assign(byRole('faq'),{items:'IT를 잘 몰라도 되나요?|문장을 쓰는 책입니다. 워크시트를 따라 쓰면 됩니다.\n업종이 달라도 쓸 수 있나요?|부록 D에 12개 업종 적용표가 있습니다.\n책 속 회사는 실제인가요?|이해를 돕기 위한 가상 사례입니다. 실존 기업 사례는 공개 자료로 확인한 것만 출처와 함께 실었습니다.\n결과가 보장되나요?|쓰는 방법을 알려 드립니다. 문의·매출 같은 결과는 업종과 상황에 따라 다릅니다.'});
    $('#tplKind').value='practical';
    open={};syncOpts();renderCard();renderScript();renderEditor();setTab(S.tab);renderAll();autosave();say('완성 예시로 채웠습니다: 사진 26장, 대화창 움직임, 워크시트 GIF. 저자 정보와 (확인 필요) 칸은 직접 바꿔 주세요');
  });
  $('#reset').addEventListener('click',function(){if(!confirm('카드·스크립트·블록을 모두 비우고 새로 시작할까요?'))return;S=defaults();open={};syncOpts();renderCard();renderScript();renderEditor();setTab('card');renderAll();autosave();});

  /* ===== 작업 파일 ===== */
  function stamp(){var d=new Date();return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');}
  function dl(href,name){var a=document.createElement('a');a.href=href;a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);}
  function base(){return (S.card.item||'스토리').replace(/[\\/:*?"<>|\s]+/g,'_');}
  $('#saveProj').addEventListener('click',function(){dl(URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'})),base()+'_작업파일_'+stamp()+'.json');say('사진까지 포함해 작업 파일을 저장했습니다');});
  $('#openProj').addEventListener('change',function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);if(!(o&&o.v===1&&Array.isArray(o.blocks)))throw 0;S=o;S.card=S.card||{};S.script=S.script||{};open={};syncOpts();renderCard();renderScript();renderEditor();setTab(S.tab||'card');renderAll();autosave();say('작업 파일을 열었습니다');}catch(e){say('이 도구로 저장한 작업 파일이 아닙니다');}};r.readAsText(f);this.value='';});

  /* ===== 보기 ===== */
  function setDev(d){S.dev=d;['vDesk','vMob','vRaw'].forEach(function(id){$('#'+id).classList.remove('on');});$({desktop:'#vDesk',mobile:'#vMob',raw:'#vRaw'}[d]).classList.add('on');renderAll();autosave();}
  $('#vDesk').addEventListener('click',function(){setDev('desktop');});
  $('#vMob').addEventListener('click',function(){setDev('mobile');});
  $('#vRaw').addEventListener('click',function(){setDev('raw');});

  /* ===== 붙여넣기 순서 ===== */
  function isGif(b){return b.type==='objection'&&b.look==='chat'&&b.anim;}
  function runs(){var R=[],cur=null;S.blocks.forEach(function(b,i){if(b.type==='media'){R.push({t:'media',i:[i]});cur=null;}else if(isGif(b)){R.push({t:'gif',i:[i]});cur=null;}else if(isText(b)){R.push({t:'text',i:[i]});cur=null;}else{if(!cur){cur={t:'img',i:[]};R.push(cur);}cur.i.push(i);}});return R;}
  function rewardText(){return rewards().map(function(r){return '['+r.name+']\n구성: '+incNames(r).join(' + ')+'\n펀딩가: '+won(r.price)+(r.list?' (정가 '+won(r.list)+(r.off?', '+r.off+'% 할인':'')+')':'')+(r.qty?'\n수량: '+r.qty+'개':'');}).join('\n\n');}
  function seqHTML(){
    var R=runs();var h='<h2>와디즈 에디터 붙여넣기 순서</h2><p class="hint">위에서부터 차례로 올립니다. 이미지 묶음은 <b>스토리 내보내기</b>로 받은 파일 번호와 같습니다.</p>';
    R.forEach(function(r,k){var no=String(k+1).padStart(2,'0');
      if(r.t==='media'){var mb=S.blocks[r.i[0]];h+='<div class="seq"><div class="h"><span class="k" style="background:#c98a12">GIF·영상</span>'+no+' · 직접 올리기</div><div class="hint">'+esc(mb.what||'(무엇을 올릴지 적어 주세요)')+(mb.img?' · 파일: '+no+'_'+esc(mediaName(mb)):(mb.file?' · 파일: '+esc(mb.file):''))+'</div></div>';return;}
      if(r.t==='gif'){h+='<div class="seq"><div class="h"><span class="k" style="background:#7b3fb0">GIF</span>'+no+' · '+TYPES.objection.n+' (움직이는 대화)<span style="flex:1"></span><button class="btn s g" data-gif="'+r.i[0]+'">GIF만 받기</button></div><div class="hint">파일: '+no+'_대화창.gif · 이미지 대신 GIF로 올립니다</div></div>';return;}
      if(r.t==='img')h+='<div class="seq"><div class="h"><span class="k">이미지</span>'+no+' · '+r.i.map(function(i){return TYPES[S.blocks[i].type].n;}).join(' → ')+'</div><div class="hint">파일: '+no+'_이미지_*.png</div></div>';
      else{var t=textOf(S.blocks[r.i[0]]);h+='<div class="seq t"><div class="h"><span class="k">텍스트</span>'+no+' · '+TYPES[S.blocks[r.i[0]].type].n+'<span style="flex:1"></span><button class="btn s g" data-copy="'+k+'">복사</button></div><pre>'+esc(t||'(비어 있음)')+'</pre></div>';}
    });
    h+='<div class="seq"><div class="h"><span class="k" style="background:#7a5d1d">리워드</span>리워드 등록용<span style="flex:1"></span><button class="btn s g" data-copy="rw">복사</button></div><pre>'+esc(rewardText()||'(리워드 없음)')+'</pre></div>';
    h+='<div class="row" style="justify-content:flex-end"><button class="btn d" data-close>닫기</button></div>';
    return h;
  }
  function copy(t,btn){var done=function(){btn.textContent='복사됨';setTimeout(function(){btn.textContent='복사';},1500);};if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,function(){fallback();});}else fallback();function fallback(){var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){say('복사하지 못했습니다. 글을 직접 선택해 복사하세요');}document.body.removeChild(ta);}}
  $('#seqBtn').addEventListener('click',function(){$('#seqBody').innerHTML=seqHTML();$('#seqDlg').showModal();});
  $('#seqBody').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-close')){$('#seqDlg').close();return;}if(b.dataset.gif!=null){var gi=+b.dataset.gif,gno=String(runs().findIndex(function(r){return r.i[0]===gi;})+1).padStart(2,'0');b.disabled=true;b.textContent='만드는 중…';chatGif(gi).then(function(bl){dl(URL.createObjectURL(bl),gno+'_대화창.gif');b.textContent='받음';},function(){b.textContent='실패';say('GIF를 만들지 못했습니다. 인터넷 연결을 확인하세요');});return;}var k=b.dataset.copy;if(k==null)return;var R=runs();copy(k==='rw'?rewardText():textOf(S.blocks[R[+k].i[0]]),b);});

  /* ===== 대화창 GIF: 질문 → 입력 중 → 답 순서로 프레임을 찍어 GIF로 묶음 ===== */
  var GIFENC='https://cdn.jsdelivr.net/npm/gifenc@1.0.3/dist/gifenc.esm.js';
  function mediaName(b){var f=(b.file||'').trim();if(!f){var m=/\.(gif|png|jpe?g|webp|mp4)(\?|$)/i.exec(b.img||'');f='움직이는_이미지.'+(m?m[1].toLowerCase():'gif');}return f;}
  function chatGif(bi){
    var pg=$('#page'),sc=$('#scaler'),els=secEls(),el=els[bi],prevT=sc.style.transform,wasExp=pg.classList.contains('exp');
    if(!el||typeof html2canvas!=='function')return Promise.reject();
    sc.style.transform='none';pg.classList.add('exp');els.forEach(function(e,j){e.style.display=j===bi?'':'none';});
    var cm=Array.prototype.slice.call(el.querySelectorAll('.cm')),ST=[{n:0,d:700}];
    cm.forEach(function(c,j){
      if(c.classList.contains('you')){[1,2,3,1].forEach(function(k){ST.push({n:j+1,ty:j,k:k,d:230});});var len=(c.querySelector('.bub').textContent||'').length;ST.push({n:j+1,d:Math.min(4200,1400+len*45)});}
      else ST.push({n:j+1,d:1000});
    });
    ST[ST.length-1].d=3600;
    function setSt(s){cm.forEach(function(c,i){c.classList.toggle('h',i>=s.n);c.classList.toggle('ty',i===s.ty);c.setAttribute('data-k',s.k||'');});}
    function clean(){cm.forEach(function(c){c.classList.remove('h','ty');c.removeAttribute('data-k');});els.forEach(function(e){e.style.display='';});if(!wasExp)pg.classList.remove('exp');sc.style.transform=prevT;}
    var frames=[],k=0;
    function shot(){
      if(k>=ST.length)return Promise.resolve();
      setSt(ST[k]);
      return html2canvas(el,{scale:1,useCORS:true,backgroundColor:'#ffffff',logging:false}).then(function(cv){frames.push({c:cv,d:ST[k].d});k++;return shot();});
    }
    say('대화창 GIF를 만드는 중… ('+ST.length+'장면)');
    return (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(shot).then(function(){clean();return import(GIFENC);}).then(function(G){
      var w=frames[0].c.width,h=frames[0].c.height,gif=G.GIFEncoder();
      var last=frames[frames.length-1].c.getContext('2d').getImageData(0,0,w,h).data,pal=G.quantize(last,256);
      frames.forEach(function(f,i){var d=f.c.getContext('2d').getImageData(0,0,w,h).data;gif.writeFrame(G.applyPalette(d,pal),w,h,{palette:pal,delay:f.d,repeat:0,first:i===0});});
      gif.finish();return new Blob([gif.bytes()],{type:'image/gif'});
    },function(e){clean();throw e;});
  }

  /* 긴 이미지를 나눌 자리: 글자가 잘리지 않게 ① 블록 경계 ② 한 가지 색으로만 된 빈 줄(가장 두꺼운 곳) ③ 그래도 없으면 정해진 높이 */
  function splitPoints(cv,H,bounds){
    var W=cv.width,T=cv.height,out=[0],cur=0,ctx=cv.getContext('2d');
    while(T-cur>H){
      var lo=cur+Math.round(H*0.55),hi=cur+H,cut=0;
      bounds.forEach(function(b){if(b>=lo&&b<=hi&&b>cut)cut=b;});
      if(!cut){
        var d=ctx.getImageData(0,lo,W,hi-lo).data,best=0,bestY=0,run=0;
        for(var y=0;y<hi-lo;y++){
          var o=y*W*4,r0=d[o],g0=d[o+1],b0=d[o+2],flat=true;
          for(var x=0;x<W;x+=3){var k=o+x*4;if(Math.abs(d[k]-r0)>6||Math.abs(d[k+1]-g0)>6||Math.abs(d[k+2]-b0)>6){flat=false;break;}}
          if(flat){run++;if(run>=best){best=run;bestY=y-Math.floor(run/2);}}else run=0;
        }
        if(best>=6)cut=lo+bestY;
      }
      if(!cut)cut=hi;
      out.push(cut);cur=cut;
    }
    out.push(T);return out;
  }

  /* ===== 내보내기: 이미지 묶음 + 텍스트 + 순서표 ===== */
  function exportAll(){
    if(typeof html2canvas!=='function'){say('이미지 저장 기능을 불러오지 못했습니다. 인터넷 연결을 확인하세요');return;}
    var R=runs(),pg=$('#page'),sc=$('#scaler'),scale=+$('#x-scale').value,SL=3000,els=secEls(),order=[],k=0;
    var prevT=sc.style.transform;sc.style.transform='none';pg.classList.add('exp');say('내보내는 중… (파일 여러 개를 받도록 허용해 주세요)');
    function restore(){els.forEach(function(e){e.style.display='';});pg.classList.remove('exp');sc.style.transform=prevT;}
    function next(){
      if(k>=R.length){restore();
        var txt='﻿'+(S.card.item||'스토리')+' · 와디즈 에디터 붙여넣기 순서 ('+stamp()+')\n\n'+order.join('\n\n')+'\n\n────────\n리워드 등록용\n\n'+rewardText()+'\n';
        dl(URL.createObjectURL(new Blob([txt],{type:'text/plain;charset=utf-8'})),'00_붙여넣기_순서.txt');var ng=R.filter(function(r){return r.t==='gif';}).length;say('내보냈습니다: 순서표 1개와 이미지 묶음 '+R.filter(function(r){return r.t==='img';}).length+'개'+(ng?', 대화창 GIF '+ng+'개':''));return;}
      var r=R[k],no=String(k+1).padStart(2,'0');k++;
      if(r.t==='media'){var mb=S.blocks[r.i[0]];if(mb.img)dl(mb.img,no+'_'+mediaName(mb));order.push(no+' [GIF·영상 직접 올리기] '+(mb.what||'')+(mb.img?'\n파일: '+no+'_'+mediaName(mb):(mb.file?'\n파일: '+mb.file:'')));setTimeout(next,mb.img?400:0);return;}
      if(r.t==='gif'){chatGif(r.i[0]).then(function(bl){sc.style.transform='none';pg.classList.add('exp');dl(URL.createObjectURL(bl),no+'_대화창.gif');order.push(no+' [GIF] '+TYPES.objection.n+' (움직이는 대화)\n'+no+'_대화창.gif');setTimeout(next,400);},function(){order.push(no+' [GIF 실패] 대화창 블록: 다시 시도하거나 정지 이미지로 바꾸세요');next();});return;}
      if(r.t==='text'){order.push(no+' [텍스트] '+TYPES[S.blocks[r.i[0]].type].n+'\n'+textOf(S.blocks[r.i[0]]));next();return;}
      els.forEach(function(e,j){e.style.display=r.i.indexOf(j)>=0?'':'none';});
      (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(function(){return html2canvas(pg,{scale:scale,useCORS:true,backgroundColor:null});}).then(function(cv){
        var H=SL*scale,names=[],ys=splitPoints(cv,H,els.filter(function(e,j){return r.i.indexOf(j)>=0;}).map(function(e){return Math.round((e.getBoundingClientRect().top-pg.getBoundingClientRect().top)*scale);}));
        for(var p=0;p<ys.length-1;p++){var y0=ys[p],h=ys[p+1]-y0,c2=document.createElement('canvas');c2.width=cv.width;c2.height=h;var g=c2.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c2.width,h);g.drawImage(cv,0,y0,cv.width,h,0,0,cv.width,h);var nm=no+'_이미지_'+String.fromCharCode(97+p)+'.png';names.push(nm);dl(c2.toDataURL('image/png'),nm);}
        order.push(no+' [이미지] '+r.i.map(function(i){return TYPES[S.blocks[i].type].n;}).join(' → ')+'\n'+names.join(', '));
        setTimeout(next,400);
      },function(){restore();say('이미지 저장에 실패했습니다');});
    }
    next();
  }
  $('#exportAll').addEventListener('click',exportAll);

  window.__wsb={state:function(){return S;},qa:function(){return $('#qa').innerText;},runs:runs,textOf:function(i){return textOf(S.blocks[i]);}};

  addList();syncOpts();renderCard();renderScript();renderEditor();setTab(S.tab||'card');setDev(S.dev||'mobile');
})();
</script>
